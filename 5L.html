<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>5L 班级抽奖转盘</title>
  <link rel="stylesheet" href="wheel.css" />
  <style>
    :root { --theme: #3d5a80; --theme-dark: #2a3f5c; --accent: #c45c26; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <small>五年级数学 · 课堂抽奖</small>
      <h1>5L 班人名大转盘</h1>
    </div>
    <nav class="nav">
      <a href="5N.html">5N</a>
      <a href="5M.html">5M</a>
      <a href="5K.html">5K</a>
      <a class="current" href="5L.html">5L</a>
    </nav>
  </header>
  <main class="stage">
    <section class="wheel-wrap">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" width="620" height="620"></canvas>
      <div class="actions">
        <button id="spin" type="button">开始抽奖</button>
        <button id="reset" type="button">重置</button>
      </div>
    </section>
    <aside class="side">
      <h2>抽奖记录</h2>
      <div class="counts">
        <span>剩余<b id="remain">0</b></span>
        <span>已抽中<b id="drawnCount">0</b></span>
      </div>
      <div id="list" class="list"></div>
    </aside>
  </main>
  <div class="overlay" id="overlay">
    <div class="card">
      <p>本轮抽中</p>
      <h2 id="winner"></h2>
      <button id="close" type="button">好的</button>
    </div>
  </div>
  <script>
    window.CLASS_ID = "5L";
    window.CLASS_NAMES = ["Luca","陈其文","陈禺成","郭梓涵","韩梓熙","Helena","梁洛萱","刘峻熙","刘语庭","牛牧歌","Beauden","彭子熙","陈隽瑜","廖盈希","王思诚","温清雅","黄觉","杨溱溱"];
  </script>
  <script src="wheel.js"></script>
</body>
</html>
